document.addEventListener("keydown",e=>{if(e.key.toLowerCase()==="e"&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){openInstallerMenu();return}if(e.key==="Delete"&&selectedIconId){uninstallToBin(selectedIconId);return}if(e.key==="Escape"){closeAppWindow();closeContext();closeModal();$("startMenu").classList.remove("open");$("recycleWindow").classList.remove("show");$("blackScreen").classList.remove("show")}if(e.key==="Enter"&&document.activeElement.id==="searchInput")searchInstalled(document.activeElement.value)});
function openSearchResultMenu(id,x,y){const a=app(id),desktop=state.desktopApps.includes(id),pinned=state.pinned.includes(id);if(!a)return;openContext(`<div class="ctx" id="searchOpen">Abrir</div><div class="ctx" id="searchDelete">Borrar</div><div class="sep"></div><div class="ctx" id="searchTask">${pinned?"Desanclar":"Anclar"} a la barra de tareas</div><div class="ctx" id="searchDesktop">${desktop?"Desanclar":"Anclar"} al escritorio</div>`,x,y);$("searchOpen").onclick=()=>{closeContext();closeModal();launchApp(id)};$("searchDelete").onclick=()=>{closeContext();closeModal();uninstallToBin(id)};$("searchTask").onclick=()=>{closeContext();pinned?unpinApp(id):pinApp(id)};$("searchDesktop").onclick=()=>{closeContext();toggleDesktopApp(id)}}
function searchInstalled(query){const q=String(query||"").trim().toLowerCase();if(!q){toast("Escribí algo para buscar.");return}const found=[...new Set([...defaultAppIds,...state.installed])].filter(id=>!state.deleted.includes(id)).map(id=>app(id)).filter(a=>a&&a.name.toLowerCase().includes(q));let html=`<div class="installer-dialog"><h2>Resultados de búsqueda</h2><p>${found.length} resultado(s) para “${esc(query)}”.</p>`;html+=found.length?'<div class="installer-grid">'+found.map(a=>`<div class="installer-card search-result" data-search-id="${esc(a.id)}">${appIcon(a.id)}<span>${esc(a.name)}</span><small>Click para abrir</small></div>`).join('')+'</div>':'<div class="installer-empty">No se encontró ninguna aplicación. Probá con otro nombre.</div>';html+='<div class="buttons"><button id="closeSearch">Cerrar</button></div></div>';openModal(html);$("closeSearch").onclick=closeModal;document.querySelectorAll("[data-search-id]").forEach(el=>{el.onclick=()=>{closeModal();launchApp(el.dataset.searchId)};el.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();openSearchResultMenu(el.dataset.searchId,e.clientX,e.clientY)}})}
function updateClock(){const d=new Date();$("clock").innerHTML=d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})+"<br>"+d.toLocaleDateString("es-AR")}
function login(){const password=$("password").value.trim();if(!password){$("loginNote").textContent="Pon tu contraseña para continuar.";$("password").focus();return}$("login").style.display="none";$("password").value=""}
$("enter").onclick=login;
renderApps();updateClock();setInterval(updateClock,1000);
</script>
</body></html>

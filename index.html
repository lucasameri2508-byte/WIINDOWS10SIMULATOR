.dialogLogo{width:54px;height:54px;margin-bottom:12px}.dialog h2{font-size:21px;font-weight:400;margin:4px 0 12px}.dialog p{font-size:14px;line-height:1.5}
.buttons{display:flex;justify-content:center;gap:12px;margin-top:24px}.dialog button{min-width:95px;padding:9px 18px;border:1px solid #aaa;background:#fff;font-size:14px}
.dialog button.primary{background:#0078d7;color:#fff;border-color:#0078d7}

#blackScreen.show{display:flex}#blackScreen button{padding:9px 20px}

.windowTitle{height:36px;background:#fff;display:flex;align-items:center;padding:0 10px;gap:8px;font-size:13px}.windowTitle svg{width:19px;height:19px}.windowTitle strong{font-weight:400;flex:1}.windowTitle button{border:0;background:transparent;width:35px;height:30px;font-size:16px}.windowTitle button:hover{background:#e55;color:#fff}
.toolbar{padding:10px;background:#fafafa;border-bottom:1px solid #ddd;display:flex;gap:8px}.toolbar button{border:1px solid #ccc;background:#fff;padding:6px 10px}
#recycleItems{padding:14px;overflow:auto;display:flex;gap:12px;flex-wrap:wrap;align-content:flex-start;flex:1}.recycle-item{width:90px;text-align:center;padding:8px;font-size:12px;overflow-wrap:anywhere}.recycle-item:hover,.recycle-item.selected{background:#d9ecff;outline:1px solid #8abbe8}.recycle-item svg{display:block;width:40px;height:40px;margin:0 auto 6px}#recycleStatus{padding:7px 12px;border-top:1px solid #ddd;font-size:12px}
#toast{position:fixed;right:18px;bottom:62px;background:#222;color:#fff;padding:11px 16px;font-size:13px;z-index:120;display:none;box-shadow:0 3px 12px #0006}#toast.show{display:block}
@media(max-width:600px){#searchBox{width:42px}#searchBox span{display:none}#startMenu{width:min(330px,90vw)}#recycleWindow{left:4%;top:10%;width:92%;height:78%}}
</style>
</head>
<body>
<div id="login">
 <div class="login-card">
  <div class="login-logo" id="loginLogo"></div>
  <h1>Bienvenido</h1><p>WIINDOWS 10 SIMULATOR</p>
  <input id="password" type="password" placeholder="Escribí cualquier contraseña" autocomplete="off">
  <button id="enter">Iniciar sesión</button><div id="loginNote">Cualquier contraseña es válida.</div>
 </div>
</div>
<div id="desktop"><div id="desktopIcons"></div></div>
<div id="taskbar">
 <button class="taskbtn" id="startButton" title="Inicio"></button>
 <div id="searchBox"><span id="searchIcon"></span><span>Escribe aquí para buscar</span></div>
 <button class="taskbtn" title="Vista de tareas" id="tasksButton"></button>
 <div id="taskApps"></div><div id="tray"><span>⌃</span><span>◖</span><div id="clock"></div></div>
</div>
<div id="startMenu"><div id="startRail"><button>☰</button><button>♙</button><button id="settingsButton">⚙</button><button id="powerButton">⏻</button></div><div id="startContent"><h3>APLICACIONES</h3><div id="startAppList"></div></div></div>
<div id="contextMenu"></div>
<div id="modalLayer"><div class="dialog" id="dialogContent"></div></div>
<div id="blackScreen"><div id="blackMessage">Aplicación abierta</div><button id="closeBlack">Volver al escritorio</button></div>
<div id="recycleWindow">
 <div class="windowTitle"><span id="binTitleIcon"></span><strong>Papelera de reciclaje</strong><button id="closeRecycle">×</button></div>
 <div class="toolbar"><button id="restoreButton">Restaurar elemento</button><button id="emptyButton">Vaciar papelera</button></div>
 <div id="recycleItems"></div><div id="recycleStatus">0 elementos</div>
</div>
<div id="toast"></div>
<script>
const STORAGE_KEY="wiindows10simulator_v3";
const $=id=>document.getElementById(id);
const svg=(kind)=> {
 const common='xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"';
 const art={
  windows:`<path fill="#19a7ed" d="M4 12 29 8v22H4zm28-4 28-4v26H32zM4 34h25v22L4 52zm28 0h28v26l-28-4z"/>`,
  bin:`<path fill="#dceaf2" stroke="#647d8a" stroke-width="2" d="M15 19h34l-3 37H18z"/><path fill="#8bd0ef" d="M19 23h26l-2 29H21z"/><path fill="none" stroke="#647d8a" stroke-width="3" d="M12 15h40M24 11h16"/>`,
  edge:`<path fill="#13a6d9" d="M56 43c-4 12-17 17-30 14C9 54 3 43 7 29 11 12 30 3 47 12 34 8 22 18 22 29c0 8 7 13 17 13z"/><path fill="#0874bd" d="M7 35c6 8 21 10 36 4 9-4 14-10 12-17 9 20-5 35-23 35C17 57 7 49 7 35z"/><path fill="#35c7a5" d="M22 29c4-13 23-16 34-7 4 4 6 9 5 15-9-8-26-8-39-2z"/>`,
  folder:`<path fill="#f6c84c" d="M5 15h22l6 7h26v31H5z"/><path fill="#ffdc75" d="M5 22h54l-5 30H5z"/>`,
  note:`<path fill="#eaf7ff" stroke="#5599bd" stroke-width="2" d="M13 5h28l11 11v43H13z"/><path fill="none" stroke="#5a9fca" stroke-width="3" d="M21 27h23M21 36h23M21 45h18"/><path fill="#b7e2f7" d="M41 5v12h11"/>`,
  calc:`<rect x="10" y="4" width="44" height="56" rx="5" fill="#dcebf4" stroke="#62879a" stroke-width="2"/><rect x="16" y="10" width="32" height="12" fill="#8ec9df"/><g fill="#5798b6"><rect x="16" y="28" width="8" height="8"/><rect x="28" y="28" width="8" height="8"/><rect x="40" y="28" width="8" height="8"/><rect x="16" y="41" width="8" height="8"/><rect x="28" y="41" width="8" height="8"/><rect x="40" y="41" width="8" height="8"/></g>`,
  search:`<circle cx="27" cy="27" r="16" fill="none" stroke="#1689c7" stroke-width="6"/><path d="m39 39 15 15" stroke="#1689c7" stroke-width="7" stroke-linecap="round"/>`,
  task:`<rect x="7" y="10" width="22" height="19" rx="2" fill="#45b8e8"/><rect x="35" y="10" width="22" height="19" rx="2" fill="#45b8e8"/><rect x="7" y="35" width="22" height="19" rx="2" fill="#45b8e8"/><rect x="35" y="35" width="22" height="19" rx="2" fill="#45b8e8"/>`
 };
 return `<svg ${common}>${art[kind]||art.note}</svg>`;
};
$("loginLogo").innerHTML=svg("windows");
$("startButton").innerHTML=svg("windows");$("searchIcon").innerHTML=svg("search");$("tasksButton").innerHTML=svg("task");$("binTitleIcon").innerHTML=svg("bin");
const apps=[
 {id:"edge",name:"Microsoft Edge",kind:"edge",url:"https://www.bing.com"},
 {id:"explorer",name:"Explorador de archivos",kind:"folder",url:null},
 {id:"notepad",name:"Bloc de notas",kind:"note",url:null},
 {id:"calculator",name:"Calculadora",kind:"calc",url:null}
];
let state=loadState(),selectedRecycle=null,installTimer=null,drag=null,rightTap={time:0,file:null};
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(s&&Array.isArray(s.installed)&&Array.isArray(s.deleted))return s;}catch(e){}return{installed:["edge","explorer","notepad","calculator"],deleted:[],positions:{}}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){toast("No se pudo guardar en este navegador.")}}
function app(id){return apps.find(a=>a.id===id)}
function appIcon(id){return svg(app(id)?.kind||"note")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2400)}
function closeContext(){$("contextMenu").style.display="none"}
function closeModal(){$("modalLayer").classList.remove("show");clearInterval(installTimer)}
function openModal(html){$("dialogContent").innerHTML=html;$("modalLayer").classList.add("show")}
function renderApps(){
 $("desktopIcons").querySelectorAll(".app-icon").forEach(x=>x.remove());
 state.installed.forEach((id,i)=>{const a=app(id);if(!a)return;const el=document.createElement("div");el.className="dicon app-icon";el.dataset.file=id;const p=state.positions[id]||{x:8,y:8+i*96};el.style.left=p.x+"px";el.style.top=p.y+"px";el.innerHTML=appIcon(id)+`<span>${esc(a.name)}</span>`;el.addEventListener("click",()=>selectIcon(el));el.addEventListener("dblclick",()=>launchApp(id));el.addEventListener("contextmenu",e=>{e.preventDefault();openAppMenu(id,e.clientX,e.clientY)});el.addEventListener("pointerdown",e=>onPointerDown(e,el,id));$("desktopIcons").appendChild(el)});
 renderStartApps();updateRecycleIcon();saveState();
}
function selectIcon(el){document.querySelectorAll(".dicon.selected").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")}
function renderStartApps(){$("startAppList").innerHTML="";state.installed.forEach(id=>{const a=app(id);if(!a)return;const row=document.createElement("div");row.className="start-app";row.innerHTML=appIcon(id)+`<span>${esc(a.name)}</span>`;row.onclick=()=>launchApp(id);$("startAppList").appendChild(row)})}
function updateRecycleIcon(){const el=$("recycleIcon");if(el)el.innerHTML=svg("bin")+`<span>Papelera de reciclaje</span>`;renderRecycle()}
function showInstallMenu(){const available=apps.filter(a=>!state.installed.includes(a.id)&&!state.deleted.includes(a.id));let html='<div style="font-weight:600;padding:9px 13px">INSTALAR APLICACIONES</div><div class="sep"></div>';if(!available.length)html+='<div style="padding:12px;color:#777">No hay aplicaciones nuevas.</div>';available.forEach(a=>html+=`<div class="ctx install-choice" data-id="${a.id}">${appIcon(a.id)}<span>${esc(a.name)}</span></div>`);openModal(`<div style="text-align:left">${html}<div style="text-align:right;margin-top:12px"><button id="closeInstall">Cerrar</button></div></div>`);$("closeInstall").onclick=closeModal;$("dialogContent").querySelectorAll(".install-choice").forEach(row=>row.onclick=()=>confirmInstall(row.dataset.id))}
function confirmInstall(id){const a=app(id);openModal(`${appIcon(id)}<h2>¿Instalar ${esc(a.name)}?</h2><p>Se agregará un acceso directo al escritorio del simulador.</p><div class="buttons"><button class="primary" id="yesInstall">Sí</button><button id="noInstall">No</button></div>`);$("yesInstall").onclick=()=>startInstall(id);$("noInstall").onclick=closeModal}
function startInstall(id){let n=0;openModal(`${appIcon(id)}<h2>Instalando ${esc(app(id).name)}...</h2><p id="progressText">Preparando...</p><div style="height:8px;background:#ddd;margin:24px 0 10px"><div id="progressFill" style="height:100%;width:0;background:#0078d7"></div></div>`);installTimer=setInterval(()=>{n=Math.min(100,n+10);$("progressFill").style.width=n+"%";$("progressText").textContent=n+"%";if(n>=100){clearInterval(installTimer);state.installed.push(id);state.deleted=state.deleted.filter(x=>x!==id);renderApps();setTimeout(()=>{closeModal();toast("Aplicación instalada.")},300)}},130)}
function launchApp(id){closeContext();$("startMenu").classList.remove("open");const a=app(id);if(!a)return;if(a.url){window.open(a.url,"_blank","noopener");return}if(id==="explorer"){$("blackMessage").textContent="Este es el Explorador de archivos simulado."; }else if(id==="notepad"){$("blackMessage").innerHTML='<textarea style="width:min(700px,85vw);height:55vh;padding:14px;font:15px Consolas;color:#222" placeholder="Escribí aquí..."></textarea>'}else if(id==="calculator"){$("blackMessage").innerHTML='<div style="background:#fff;color:#222;padding:20px;font-size:22px">Calculadora<br><input id="calcInput" placeholder="Ej.: 12*8" style="margin-top:12px;padding:8px"><button onclick="try{document.getElementById(\\'calcResult\\').textContent=Function(\\'return (\\'+document.getElementById(\\'calcInput\\').value+\\')\\')()}catch(e){document.getElementById(\\'calcResult\\').textContent=\\'Error\\'}">=</button><p id="calcResult"></p></div>'} $("blackScreen").classList.add("show")}
function uninstallToBin(id){state.installed=state.installed.filter(x=>x!==id);if(!state.deleted.includes(id))state.deleted.push(id);delete state.positions[id];renderApps();toast("Se movió a la Papelera.")}
function openContext(html,x,y){const m=$("contextMenu");m.innerHTML=html;m.style.display="block";const r=m.getBoundingClientRect();m.style.left=Math.max(0,Math.min(x,innerWidth-r.width-4))+"px";m.style.top=Math.max(0,Math.min(y,innerHeight-r.height-4))+"px"}
function openAppMenu(id,x,y){openContext(`<div class="ctx" id="openApp">Abrir</div><div class="ctx" id="removeApp">Desinstalar</div>`,x,y);$("openApp").onclick=()=>launchApp(id);$("removeApp").onclick=()=>{closeContext();uninstallToBin(id)}}
function onPointerDown(e,el,id){if(e.button!==2)return;e.preventDefault();const x=e.clientX,y=e.clientY;drag={id,el,x,y,left:parseFloat(el.style.left)||0,top:parseFloat(el.style.top)||0,moved:false};try{el.setPointerCapture(e.pointerId)}catch(_){}}
document.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>7)drag.moved=true;if(drag.moved){drag.el.style.left=Math.max(0,drag.left+dx)+"px";drag.el.style.top=Math.max(0,drag.top+dy)+"px"}});
document.addEventListener("pointerup",e=>{if(!drag||e.button!==2)return;const d=drag;drag=null;if(d.moved){const r=$("recycleIcon").getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)uninstallToBin(d.id);else{state.positions[d.id]={x:parseFloat(d.el.style.left),y:parseFloat(d.el.style.top)};saveState()}}else{const now=Date.now();if(rightTap.file===d.id&&now-rightTap.time<550){rightTap={time:0,file:null};launchApp(d.id)}else rightTap={time:now,file:d.id}}});
$("desktop").addEventListener("contextmenu",e=>e.preventDefault());
$("desktop").addEventListener("click",e=>{if(e.target.closest(".dicon"))return;openContext('<div class="ctx" id="installMenu">＋　<strong>INSTALAR</strong></div><div class="sep"></div><div class="ctx" id="refreshMenu">↻　Actualizar</div><div class="ctx" id="recycleMenu">♻　Abrir Papelera de reciclaje</div>',e.clientX,e.clientY);$("installMenu").onclick=()=>{closeContext();showInstallMenu()};$("refreshMenu").onclick=()=>{closeContext();renderApps();toast("Escritorio actualizado.")};$("recycleMenu").onclick=openRecycle});
const bin=document.createElement("div");bin.id="recycleIcon";bin.className="dicon";bin.style.cssText="left:8px;top:8px";bin.innerHTML=svg("bin")+"<span>Papelera de reciclaje</span>";$("desktopIcons").appendChild(bin);bin.addEventListener("click",()=>selectIcon(bin));bin.addEventListener("dblclick",openRecycle);bin.addEventListener("contextmenu",e=>{e.preventDefault();openContext('<div class="ctx" id="openBin">♻　Abrir</div><div class="ctx" id="emptyBin">Vaciar papelera</div>',e.clientX,e.clientY);$("openBin").onclick=openRecycle;$("emptyBin").onclick=emptyRecycle});
function openRecycle(){closeContext();$("startMenu").classList.remove("open");$("recycleWindow").classList.add("show");renderRecycle()}
function renderRecycle(){$("recycleItems").innerHTML="";selectedRecycle=null;state.deleted.forEach(id=>{const el=document.createElement("div");el.className="recycle-item";el.innerHTML=appIcon(id)+`<span>${esc(app(id)?.name||id)}</span>`;el.onclick=()=>{document.querySelectorAll(".recycle-item").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");selectedRecycle=id};el.ondblclick=()=>restoreFile(id);$("recycleItems").appendChild(el)});$("recycleStatus").textContent=state.deleted.length+" elemento(s)";$("restoreButton").disabled=!state.deleted.length;$("emptyButton").disabled=!state.deleted.length}
function restoreFile(id){state.deleted=state.deleted.filter(x=>x!==id);if(!state.installed.includes(id))state.installed.push(id);renderApps();toast("Aplicación restaurada.")}
function emptyRecycle(){if(!state.deleted.length)return;if(!confirm("¿Vaciar la papelera?"))return;state.deleted=[];renderApps();toast("Papelera vaciada.")}
$("startButton").onclick=e=>{e.stopPropagation();closeContext();$("startMenu").classList.toggle("open")};$("settingsButton").onclick=()=>toast("Configuración: próximamente.");$("powerButton").onclick=()=>{$("login").style.display="flex";$("startMenu").classList.remove("open")};$("closeRecycle").onclick=()=>$("recycleWindow").classList.remove("show");$("restoreButton").onclick=()=>selectedRecycle?restoreFile(selectedRecycle):toast("Seleccioná un elemento.");$("emptyButton").onclick=emptyRecycle;$("closeBlack").onclick=()=>$("blackScreen").classList.remove("show");
document.addEventListener("click",e=>{if(!e.target.closest("#contextMenu"))closeContext();if(!e.target.closest("#startMenu")&&!e.target.closest("#startButton"))$("startMenu").classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeContext();closeModal();$("startMenu").classList.remove("open");$("recycleWindow").classList.remove("show");$("blackScreen").classList.remove("show")}if(e.key==="Enter"&&$("login").style.display!=="none")login()});
function updateClock(){const d=new Date();$("clock").innerHTML=d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})+"<br>"+d.toLocaleDateString("es-AR")}
function login(){$("login").style.display="none";$("password").value=""}
$("enter").onclick=login;
renderApps();updateClock();setInterval(updateClock,1000);
</script>
</body></html>
